# API Gateway de HanZi Mentor — proxy reverso mínimo.
#
# Por qué existe: HanZi Mentor es una PWA mobile-first. Un único punto de
# entrada evita que el cliente móvil tenga que conocer cada servicio, su
# puerto y su CORS, y es el lugar natural para agregar más adelante
# autenticación centralizada y rate limiting sin tocar el código de negocio.
#
# Strangler Pattern (taller 02): este archivo es el que decide, según el
# prefijo de la URL, si una petición la atiende el monolito o el
# microservicio nuevo. Ambos coexisten y el cliente no percibe la migración:
#
#   /api/v1/tutor/*   -> agente_tutor  (Django: sesiones, respuestas, progreso)
#   /api/v1/*         -> contenido     (Django, rutas antiguas)
#   /api/v2/trazos/*  -> flask_trazos  (Flask, validación de trazos)
#   /api/*            -> 404 JSON      (prefijo de API no expuesto)
#   /*                -> frontend      (PWA estática)
#
# Corre dentro de Docker: los upstreams son los nombres de servicio de
# docker-compose.yml, que la red interna de Docker resuelve por DNS.
#
# Cómo probarlo, desde la raíz del repo:
#   1. docker compose up -d --build
#   2. curl "http://localhost/api/v1/caracteres/?nivel=1&limite=5"
#   3. curl http://localhost/api/v1/tutor/progreso/00000000-0000-0000-0000-000000000000/
#   4. curl -X POST http://localhost/api/v2/trazos/validar/ \
#        -H "Content-Type: application/json" \
#        -d '{"mediana": [[0,0],[100,100]], "puntos": [[0,0],[30,30]], "ancho": 300, "alto": 300}'
#   5. curl http://localhost/    (index.html del frontend)
#   6. docker compose logs nginx   (cada línea muestra a qué backend fue)
#
# `usuarios` todavía no está en docker-compose.yml.
#
# No implementa TLS ni autenticación.

worker_processes 1;

events {
    worker_connections 512;
}

http {
    # $upstream_addr deja en el log qué backend atendió cada petición: es
    # la evidencia de que el tráfico se bifurca según la URL.
    log_format ruteo '$remote_addr "$request" $status -> $upstream_addr';
    access_log /var/log/nginx/access.log ruteo;

    upstream contenido {
        server contenido:8002;
    }

    upstream flask_trazos {
        server flask_trazos:5000;
    }

    upstream agente_tutor {
        server agente_tutor:8003;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Cabeceras que cada servicio necesita para saber quién preguntó
        # realmente, ya que ahora el que conecta es el gateway.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- v1: agente-tutor (sesiones, respuestas, progreso) ---
        # Va antes que /api/v1/ para dejarlo explícito, aunque Nginx elige
        # igual el prefijo más largo. Como en contenido, agente-tutor declara
        # sus rutas bajo /api/: Nginx reemplaza /api/v1/tutor/ por /api/.
        location /api/v1/tutor/ {
            proxy_pass http://agente_tutor/api/;
        }

        # --- v1: monolito Django (caracteres, lecciones) ---
        # Django declara sus rutas bajo /api/ y no bajo /api/v1/. Al terminar
        # proxy_pass con la URI /api/, Nginx reemplaza el prefijo /api/v1/
        # por /api/: la API pública queda versionada sin tocar Django.
        location /api/v1/ {
            proxy_pass http://contenido/api/;
        }

        # --- v2: microservicio Flask (funcionalidad estrangulada) ---
        # Sin URI en proxy_pass: Flask recibe la ruta completa, porque ya
        # declara /api/v2/trazos/validar/.
        location /api/v2/trazos/ {
            proxy_pass http://flask_trazos;
        }

        # Otro prefijo de API: el gateway no adivina. Sin esta regla caería en
        # el frontend y devolvería el index.html con 200.
        location /api/ {
            default_type application/json;
            return 404 '{"error": "Ruta no expuesta por el gateway.", "codigo": "NO_ENCONTRADO"}';
        }

        # --- Frontend: la PWA estática (su Nginx resuelve las rutas del SPA) ---
        location / {
            proxy_pass http://frontend;
        }
    }
}
