# API Gateway de HanZi Mentor — proxy reverso mínimo.
#
# Por qué existe: HanZi Mentor es una PWA mobile-first. Hoy el frontend le
# pega directo a tres puertos distintos (usuarios:8001, contenido:8002,
# agente-tutor:8003), lo que rompe apenas se despliega detrás de HTTPS, un
# balanceador o un dominio propio, y obliga a mantener CORS abierto en cada
# microservicio por separado.
#
# Este gateway resuelve eso dando un único punto de entrada:
#   - Un solo host/puerto (y en producción, un solo certificado TLS) para
#     que el cliente móvil hable con.
#   - Ruteo por prefijo de URL hacia el microservicio dueño de ese recurso,
#     sin que el cliente sepa que existen tres servicios Django distintos.
#   - Lugar natural para agregar más adelante autenticación centralizada
#     (validar el JWT una sola vez, no en cada servicio) y rate limiting,
#     sin tocar el código de negocio.
#
# Cómo probarlo en local:
#   1. Levantar los tres servicios Django como indica el README (puertos
#      8001, 8002 y 8003).
#   2. brew install nginx   (o el gestor de paquetes de tu SO)
#   3. nginx -c "$(pwd)/infra/nginx/nginx.conf" -p "$(pwd)/infra/nginx"
#   4. Probar: curl http://localhost:8080/api/caracteres/学/
#
# No implementa TLS ni autenticación: esta entrega solo pide dejar el
# sistema *preparado* para un gateway, no un gateway productivo.

worker_processes 1;
pid /tmp/hanzimentor-gateway.pid;

events {
    worker_connections 512;
}

http {
    # En Docker, cambiar 127.0.0.1 por el nombre del servicio
    # (usuarios, contenido, agente-tutor) y este archivo sirve tal cual.
    upstream usuarios {
        server 127.0.0.1:8001;
    }

    upstream contenido {
        server 127.0.0.1:8002;
    }

    upstream agente_tutor {
        server 127.0.0.1:8003;
    }

    server {
        listen 8080;
        server_name _;

        # Cabeceras que cada servicio necesita para saber quién preguntó
        # realmente, ya que ahora el que conecta es el gateway.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Servicio agente-tutor: sesiones, ejercicios, progreso ---
        location /api/sesiones/ {
            proxy_pass http://agente_tutor;
        }

        location /api/ejercicios/ {
            proxy_pass http://agente_tutor;
        }

        location /api/progreso/ {
            proxy_pass http://agente_tutor;
        }

        # --- Servicio contenido: caracteres, trazos, lecciones ---
        location /api/caracteres/ {
            proxy_pass http://contenido;
        }

        location /api/lecciones/ {
            proxy_pass http://contenido;
        }

        # --- Servicio usuarios: cuentas y suscripciones ---
        # (Usuario y Suscripcion todavía no exponen API — la ruta queda
        # declarada para cuando se implementen, sin que el cliente móvil
        # tenga que cambiar nada.)
        location /api/usuarios/ {
            proxy_pass http://usuarios;
        }

        location /api/suscripciones/ {
            proxy_pass http://usuarios;
        }

        # Cualquier otra cosa: el gateway no es un servicio, no adivina.
        location / {
            return 404 '{"error": "Ruta no expuesta por el gateway."}';
            default_type application/json;
        }
    }
}
