# API Gateway de HanZi Mentor — proxy reverso mínimo.
#
# Por qué existe: HanZi Mentor es una PWA mobile-first. Un único punto de
# entrada evita que el cliente móvil tenga que conocer cada servicio, su
# puerto y su CORS, y es el lugar natural para agregar más adelante
# autenticación centralizada y rate limiting sin tocar el código de negocio.
#
# Strangler Pattern (taller 02): este archivo es el que decide, según el
# prefijo de la URL, si una petición la atiende el monolito o el
# microservicio nuevo. Ambos coexisten y el cliente no percibe la migración:
#
#   /api/v1/tutor/*   -> agente_tutor  (Django: sesiones, respuestas, progreso)
#   /api/v1/*         -> contenido     (Django, rutas antiguas)
#   /api/v2/trazos/*  -> flask_trazos  (Flask, validación de trazos)
#   /api/v2/caracteres/*, /api/v2/lecciones/* -> flask_catalogo (Flask)
#   /api/v2/ejemplos/* -> flask_ejemplos (Flask, frases de Tatoeba)
#   /api/*            -> 404 JSON      (prefijo de API no expuesto)
#   /*                -> frontend      (PWA estática)
#
# v1 de caracteres y lecciones (contenido) se mantiene como respaldo del
# Strangler: el cliente ya usa v2, pero /api/v1/ sigue respondiendo.
#
# Corre dentro de Docker: los destinos son los nombres de servicio de
# docker-compose.yml, que el DNS interno de Docker (127.0.0.11) resuelve en
# cada petición. Así Nginx arranca aunque falte algún servicio y solo las
# rutas de ese servicio responden 502 JSON hasta que aparezca.
#
# Cómo probarlo, desde la raíz del repo:
#   1. docker compose up -d --build
#   2. curl "http://localhost/api/v1/caracteres/?nivel=1&limite=5"
#   3. curl http://localhost/api/v1/tutor/progreso/00000000-0000-0000-0000-000000000000/
#   4. curl -X POST http://localhost/api/v2/trazos/validar/ \
#        -H "Content-Type: application/json" \
#        -d '{"mediana": [[0,0],[100,100]], "puntos": [[0,0],[30,30]], "ancho": 300, "alto": 300}'
#   5. curl "http://localhost/api/v2/caracteres/?nivel=1&limite=3"
#   6. curl "http://localhost/api/v2/ejemplos/学/?lang=es&limite=2"
#   7. curl http://localhost/    (index.html del frontend)
#   8. docker compose logs nginx   (cada línea muestra a qué backend fue)
#
# `usuarios` todavía no está en docker-compose.yml.
#
# No implementa TLS ni autenticación.

worker_processes 1;

events {
    worker_connections 512;
}

http {
    # $proxy_host (servicio:puerto) y $upstream_addr (IP:puerto) dejan en el
    # log qué backend atendió cada petición: es la evidencia de que el
    # tráfico se bifurca según la URL.
    log_format ruteo '$remote_addr "$request" $status -> $proxy_host $upstream_addr';
    access_log /var/log/nginx/access.log ruteo;

    # DNS interno de Docker. Con proxy_pass sobre una variable, el nombre se
    # resuelve al atender la petición (y se cachea 10 s), no al arrancar: un
    # servicio ausente ya no impide que Nginx arranque.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    server {
        listen 80;
        server_name _;

        # Cabeceras que cada servicio necesita para saber quién preguntó
        # realmente, ya que ahora el que conecta es el gateway.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Errores del propio gateway en JSON, como los de los servicios, en
        # vez de la página HTML de Nginx: 502 (backend caído o sin
        # conexión), 503 y 504 (backend sin responder a tiempo).
        # proxy_intercept_errors queda en off (valor por defecto) a propósito:
        # así solo se reemplazan los errores que genera Nginx, y un 503 que
        # responde el servicio (p. ej. flask_ejemplos cuando Tatoeba no
        # contesta) llega al cliente con su propio JSON y su código.
        error_page 502 @error_502;
        error_page 503 @error_503;
        error_page 504 @error_504;

        location @error_502 {
            default_type application/json;
            return 502 '{"error": "El servicio no está disponible.", "codigo": "SERVICIO_NO_DISPONIBLE"}';
        }

        location @error_503 {
            default_type application/json;
            return 503 '{"error": "El servicio está temporalmente saturado.", "codigo": "SERVICIO_SATURADO"}';
        }

        location @error_504 {
            default_type application/json;
            return 504 '{"error": "El servicio tardó demasiado en responder.", "codigo": "TIEMPO_AGOTADO"}';
        }

        # Cada location guarda su destino en $destino y hace proxy_pass sin
        # URI: Nginx envía la URI de la petición (o la que deje el rewrite).

        # --- v1: agente-tutor (sesiones, respuestas, progreso) ---
        # Va antes que /api/v1/ para dejarlo explícito, aunque Nginx elige
        # igual el prefijo más largo. Como en contenido, agente-tutor declara
        # sus rutas bajo /api/. Con una variable en proxy_pass Nginx ya no
        # reemplaza el prefijo por sí solo: el rewrite cambia /api/v1/tutor/
        # por /api/ y `break` deja la petición en esta location.
        location /api/v1/tutor/ {
            set $destino http://agente_tutor:8003;
            rewrite ^/api/v1/tutor/(.*)$ /api/$1 break;
            proxy_pass $destino;
        }

        # --- v1: monolito Django (caracteres, lecciones) ---
        # Respaldo del Strangler: el frontend y agente-tutor ya usan v2 para
        # caracteres y lecciones. No se quita hasta retirar contenido.
        # Django declara sus rutas bajo /api/ y no bajo /api/v1/: el rewrite
        # cambia /api/v1/ por /api/ y la API pública queda versionada sin
        # tocar Django.
        location /api/v1/ {
            set $destino http://contenido:8002;
            rewrite ^/api/v1/(.*)$ /api/$1 break;
            proxy_pass $destino;
        }

        # --- v2: microservicios Flask (funcionalidad estrangulada) ---
        # Sin rewrite: Flask recibe la ruta completa, porque ya declara
        # /api/v2/... en sus blueprints.
        location /api/v2/trazos/ {
            set $destino http://flask_trazos:5000;
            proxy_pass $destino;
        }

        # Catálogo: caracteres y lecciones (estrangulados de contenido).
        location /api/v2/caracteres/ {
            set $destino http://flask_catalogo:5000;
            proxy_pass $destino;
        }

        location /api/v2/lecciones/ {
            set $destino http://flask_catalogo:5000;
            proxy_pass $destino;
        }

        # Frases de ejemplo de Tatoeba (API de terceros vía Adapter).
        location /api/v2/ejemplos/ {
            set $destino http://flask_ejemplos:5000;
            proxy_pass $destino;
        }

        # Otro prefijo de API: el gateway no adivina. Sin esta regla caería en
        # el frontend y devolvería el index.html con 200.
        location /api/ {
            default_type application/json;
            return 404 '{"error": "Ruta no expuesta por el gateway.", "codigo": "NO_ENCONTRADO"}';
        }

        # --- Frontend: la PWA estática (su Nginx resuelve las rutas del SPA) ---
        location / {
            set $destino http://frontend:80;
            proxy_pass $destino;
        }
    }
}
