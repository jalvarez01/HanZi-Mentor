# Servidor estático del frontend dentro de su contenedor (no es el gateway).
# El gateway (infra/nginx/nginx.conf) le reenvía `location /`.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Service worker y archivos de la PWA: siempre se revalidan, para que una
    # versión nueva se detecte en la siguiente visita (autoUpdate).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/workbox-[^/]+\.js$ {
        add_header Cache-Control "no-cache";
    }

    # Recursos con hash en el nombre (JS, CSS, fuentes): inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del router (/trazos, /progreso...) devuelve index.html,
    # que nunca se cachea para que siempre apunte a los assets vigentes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
