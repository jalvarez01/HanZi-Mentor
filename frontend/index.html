<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eee4cd" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Pantalla completa al instalar: estándar actual y, para iOS, la variante de Apple -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HanziMentor" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Paisaje de fondo (tokens.css, --shell-image): es lo más grande de la primera
         pantalla. Sin esto el navegador lo descubre recién cuando React pinta. -->
    <link rel="preload" as="image" type="image/webp" href="/src/assets/fondos/fondo.webp" fetchpriority="high" />

    <title>HanziMentor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
